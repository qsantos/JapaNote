# Build the dictionaries from their latest versions, and publish them as assets of the
# "dictionaries" release, where the add-on looks for them (see japanote/resources.py); when the build
# script changes on another branch, only build and test them
name: Dictionaries

on:
  schedule:
    # every Monday
    - cron: '17 4 * * 1'
  workflow_dispatch:
  push:
    paths:
      - tools/**
      - '!tools/e2e/**'
      - tests/**
      - .github/workflows/dictionaries.yml

permissions:
  contents: write

concurrency:
  group: dictionaries

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Download sources
        run: python tools/build_dictionaries.py download sources

      - name: Build
        run: >
          python tools/build_dictionaries.py build sources dist
          "https://github.com/${{ github.repository }}/releases/download/dictionaries"

      - name: Test
        run: |
          pip install pytest
          python tools/build_dictionaries.py install dist db
          JAPANOTE_DB_DIR=db python -m pytest tests

      - name: Publish
        # see "unchanged" in build_dictionaries.py
        if: github.ref == 'refs/heads/master' && hashFiles('dist/unchanged') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view dictionaries > /dev/null 2>&1; then
            gh release create dictionaries --latest=false --title 'Dictionaries' \
              --notes 'Dictionaries downloaded by the add-on; updated every week. See README.md for credits.'
          fi
          format=$(basename dist/manifest-v*.json | grep -oE '[0-9]+')
          # upload the packages and patches before the manifest that points to them
          gh release upload dictionaries dist/*-v$format-*.xz --clobber
          gh release upload dictionaries dist/manifest-v$format.json --clobber
          # remove the files that are no longer needed (see assets.txt in build_dictionaries.py), including
          # those of previous formats, which the add-on no longer reads
          for asset in $(gh release view dictionaries --json assets --jq '.assets[].name'); do
            if ! grep -qxF "$asset" dist/assets.txt; then
              gh release delete-asset dictionaries "$asset" --yes
            fi
          done
